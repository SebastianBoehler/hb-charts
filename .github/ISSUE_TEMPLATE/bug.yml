name: Bug report
description: Report a reproducible HB Charts defect.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest repository or code sample that reproduces the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    attributes:
      label: Browser and HB Charts version
    validations:
      required: true
